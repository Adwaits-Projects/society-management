<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resident Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar scrolled">
  <a href="index.html" class="navbar-brand">
    <span class="brand-name">The SkyLine Township</span>
    <span class="brand-tagline">Resident Portal</span>
  </a>
  <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <ul class="navbar-links" id="navLinks">
    <li><a href="resident-dashboard.html">Dashboard</a></li>
    <li><a href="resident.html">My Flat</a></li>
    <li><a href="my-bills.html">My Bills</a></li>
    <li><a href="amenities.html">Amenities</a></li>
    <li><a href="rules.html">Rules</a></li>
    <li><a href="login.html" class="navbar-cta">Logout</a></li>
  </ul>
</nav>

<div class="dashboard">

  <div class="dashboard-panel">

    <div class="dashboard-header">
      <span class="section-label">Welcome Home</span>
      <h1>THE SKYLINE TOWNSHIP</h1>
      <h2>Resident Dashboard</h2>
    </div>

    <div class="stats">

      <div class="stat-card">
        <div class="stat-icon">👤</div>
        <h3>Resident Name</h3>
        <p id="resName" style="font-size: 1.5rem;">—</p>
      </div>

      <div class="stat-card">
        <div class="stat-icon">🏠</div>
        <h3>Flat Number</h3>
        <p id="flatNum" style="font-size: 1.5rem;">—</p>
      </div>

      <div class="stat-card">
        <div class="stat-icon">🏢</div>
        <h3>Wing</h3>
        <p id="wingName" style="font-size: 1.5rem;">—</p>
      </div>

      <div class="stat-card">
        <div class="stat-icon">🪜</div>
        <h3>Floor</h3>
        <p id="floorNum" style="font-size: 1.5rem;">—</p>
      </div>

      <div class="stat-card">
        <div class="stat-icon">✉️</div>
        <h3>Email</h3>
        <p id="email" style="font-size: 1.1rem; word-break: break-all;">—</p>
      </div>

      <div class="stat-card">
        <div class="stat-icon">📞</div>
        <h3>Phone</h3>
        <p id="phone" style="font-size: 1.3rem;">—</p>
      </div>

      <div class="stat-card">
        <div class="stat-icon">💳</div>
        <h3>Bill Status</h3>
        <p><span id="billStatus" style="font-size: 1.2rem; font-weight: bold; padding: 4px 12px; border-radius: 4px;">—</span></p>
      </div>

    </div>

    <div class="admin-buttons">

      <button onclick="window.location.href='resident.html'">
        My Flat Details
      </button>

      <button class="btn-secondary" onclick="window.location.href='my-bills.html'">
        My Bills
      </button>

      <button class="btn-secondary" onclick="window.location.href='amenities.html'">
        Amenities
      </button>

      <button class="btn-secondary" onclick="window.location.href='tour.html'">
        Society Tour
      </button>

      <button class="btn-secondary" onclick="window.location.href='rules.html'">
        Society Rules
      </button>

      <button class="btn-ghost" onclick="window.location.href='login.html'">
        Logout
      </button>

    </div>

  </div>

</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    let loggedInUser = JSON.parse(localStorage.getItem("loggedInUser"));
    if (!loggedInUser || loggedInUser.role !== "RESIDENT") {
      window.location.href = "login.html";
      return;
    }

    fetch("/api/flat/resident/" + loggedInUser.residentId, {
      headers: {
        "X-User-Role": loggedInUser.role,
        "X-User-Resident-Id": loggedInUser.residentId
      }
    })
            .then(response => {
              if (!response.ok) throw new Error();
              return response.json();
            })
            .then(data => {
              if (data && data.length > 0) {
                const details = data[0];
                document.getElementById("resName").innerText = details.owner_name || '—';
                document.getElementById("flatNum").innerText = details.flat_num || '—';
                document.getElementById("wingName").innerText = details.wing_name || '—';
                document.getElementById("floorNum").innerText = details.floor_num || '—';
                document.getElementById("email").innerText = details.email || '—';
                document.getElementById("phone").innerText = details.contact_num || '—';

                const statusEl = document.getElementById("billStatus");
                const statusVal = (details.bill_status || 'PAID').toUpperCase();
                statusEl.innerText = statusVal;
                if (statusVal === 'PAID') {
                  statusEl.style.background = 'rgba(34, 197, 94, 0.12)';
                  statusEl.style.color = '#15803d';
                } else {
                  statusEl.style.background = 'rgba(239, 68, 68, 0.12)';
                  statusEl.style.color = '#b91c1c';
                }
              }
            })
            .catch(err => {
              console.error(err);
            });
  });

  document.getElementById("navToggle").addEventListener("click", function () {
    document.getElementById("navLinks").classList.toggle("open");
  });
</script>

</body>
</html>
